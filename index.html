<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folder Organizer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f24;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;--danger:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--text:#e8eaed;--muted:#9aa0a9;--line:#2b2f37;--accent:#5b8cff;--danger:#f26b6b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:260px;background:var(--card);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
aside h1{font-size:18px;margin:0 0 4px}
main{flex:1;padding:24px;max-width:900px}
input,button,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.del{background:transparent;color:var(--danger);border:0;padding:4px 8px}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
.folder{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer}
.folder:hover{background:var(--bg)}.folder.active{background:var(--accent);color:#fff}
.folder small{opacity:.7}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.add input[type=text]{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
td a{color:var(--accent);text-decoration:none;word-break:break-all;cursor:pointer}
.empty{color:var(--muted);padding:30px;text-align:center}
.badge{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
@media(max-width:700px){body{flex-direction:column}aside{width:100%}}
#auth{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:10}
#auth .box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:min(360px,92vw);display:flex;flex-direction:column;gap:10px}
#auth h2{margin:0 0 6px}#err{font-size:13px;min-height:16px;color:var(--danger)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="auth">
  <div class="box">
    <h2>📁 Folder Organizer</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="pass" type="password" placeholder="Password (min 6 chars)" autocomplete="current-password">
    <button id="signin">Sign in</button>
    <button class="ghost" id="signup">Create account</button>
    <div id="err"></div>
  </div>
</div>
<aside class="hidden" id="side">
  <h1>📁 Folders</h1>
  <div class="row"><input id="newFolder" placeholder="New folder name"><button id="addFolder">+</button></div>
  <div id="folders"></div>
  <small id="who" style="margin-top:auto;color:var(--muted);word-break:break-all"></small>
  <button class="ghost" id="signout">Sign out</button>
</aside>
<main class="hidden" id="mainEl">
  <h2 id="title">Select or create a folder</h2>
  <div id="content"></div>
</main>

<script type="module">
// ======== PASTE YOUR SUPABASE VALUES HERE ========
const SUPABASE_URL = "xspnkpecwjfwjzlmnsdm";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhzcG5rcGVjd2pmd2p6bG1uc2RtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTExODkwNDAsImV4cCI6MjEwNjc2NTA0MH0.BlQob10fpnyqZdCN6J1Y7QfCXTjCjMBsK1cfXi78OeQ";
// =================================================

import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(SUPABASE_KEY === "YOUR_ANON_OR_PUBLISHABLE_KEY"){ $('err').textContent = "Add your Supabase URL and key in index.html first."; throw new Error("config missing"); }
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null, folders = [], items = [], current = null;

// ---------- Auth ----------
const creds = () => ({email:$('email').value.trim(), password:$('pass').value});
const fail = e => { $('err').style.color='var(--danger)'; $('err').textContent = e.message; };
$('signin').onclick = async () => { const {error} = await sb.auth.signInWithPassword(creds()); if(error) fail(error); };
$('signup').onclick = async () => {
  const {data, error} = await sb.auth.signUp(creds()); if(error) return fail(error);
  if(!data.session){ $('err').style.color='var(--muted)'; $('err').textContent='Check your email to confirm, then sign in.'; }
};
$('pass').onkeydown = e => { if(e.key==='Enter') $('signin').click(); };
$('signout').onclick = () => sb.auth.signOut();
sb.auth.onAuthStateChange((_e, session) => {
  user = session?.user || null;
  $('auth').classList.toggle('hidden', !!user);
  $('side').classList.toggle('hidden', !user);
  $('mainEl').classList.toggle('hidden', !user);
  if(user){ $('who').textContent = user.email; load(); } else { folders = items = []; current = null; }
});
document.addEventListener('visibilitychange', () => { if(!document.hidden && user) load(); });

// ---------- Data ----------
async function load(){
  const [f, i] = await Promise.all([
    sb.from('folders').select('*').order('created_at'),
    sb.from('items').select('*').order('created_at')
  ]);
  if(f.error || i.error){ $('title').textContent = 'Could not load (offline?)'; return; }
  folders = f.data; items = i.data; render();
}
const run = async p => { const {error} = await p; if(error) alert(error.message); await load(); };

function render(){
  if(current && !folders.find(f=>f.id===current)) current = null;
  $('folders').innerHTML = folders.map(f=>{
    const n = items.filter(i=>i.folder_id===f.id).length;
    return `<div class="folder ${f.id===current?'active':''}" data-id="${f.id}">
      <span>📁 ${esc(f.name)} <small>(${n})</small></span>
      <span><button class="del" data-ren="${f.id}" style="color:inherit">✎</button><button class="del" data-del="${f.id}" style="color:inherit">✕</button></span></div>`;
  }).join('') || '<div class="empty">No folders yet</div>';
  const f = folders.find(x=>x.id===current);
  if(!f){ $('title').textContent = 'Select or create a folder'; $('content').innerHTML = ''; return; }
  $('title').textContent = '📁 ' + f.name;
  const keep = ['iTitle','iLink'].map(id => $(id)?.value || '');
  const list = items.filter(i=>i.folder_id===current);
  $('content').innerHTML = `
    <div class="add">
      <input type="text" id="iTitle" placeholder="Title">
      <input type="text" id="iLink" placeholder="Paste a link (https://...)">
      <button id="addLink">Add link</button>
      <button class="ghost" id="pickPdf">Attach PDF</button>
      <input type="file" id="pdfFile" accept="application/pdf" multiple hidden>
    </div>
    ${list.length ? `<table><thead><tr><th>Title</th><th>Link / PDF</th><th></th></tr></thead><tbody>
      ${list.map(i=>`<tr><td>${esc(i.title)}</td>
        <td>${i.type==='pdf'
          ? `<span class="badge">PDF</span><a data-open="${i.id}">${esc(i.file_name)}</a> · <a data-dl="${i.id}">download</a>`
          : `<span class="badge">LINK</span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a>`}</td>
        <td><button class="del" data-edit="${i.id}" style="color:var(--muted)">✎</button><button class="del" data-rm="${i.id}">✕</button></td></tr>`).join('')}
      </tbody></table>` : '<div class="empty">This folder is empty. Add a link or attach a PDF.</div>'}`;
  $('iTitle').value = keep[0]; $('iLink').value = keep[1];
}

// ---------- Actions ----------
$('addFolder').onclick = async () => {
  const name = $('newFolder').value.trim(); if(!name) return;
  const {data, error} = await sb.from('folders').insert({name}).select().single();
  if(error) return alert(error.message);
  current = data.id; $('newFolder').value = ''; load();
};
$('newFolder').onkeydown = e => { if(e.key==='Enter') $('addFolder').click(); };

$('folders').onclick = async e => {
  const t = e.target;
  if(t.dataset.del){
    e.stopPropagation();
    if(!confirm('Delete this folder and everything inside?')) return;
    const paths = items.filter(i=>i.folder_id===t.dataset.del && i.file_path).map(i=>i.file_path);
    if(paths.length) await sb.storage.from('pdfs').remove(paths);
    return run(sb.from('folders').delete().eq('id', t.dataset.del));
  }
  if(t.dataset.ren){
    e.stopPropagation();
    const f = folders.find(x=>x.id===t.dataset.ren), n = prompt('Rename folder', f.name);
    if(n && n.trim()) run(sb.from('folders').update({name:n.trim()}).eq('id', f.id));
    return;
  }
  const el = t.closest('.folder'); if(el){ current = el.dataset.id; render(); }
};

const signed = async (i, opts) => (await sb.storage.from('pdfs').createSignedUrl(i.file_path, 3600, opts)).data?.signedUrl;
$('content').onclick = async e => {
  const t = e.target, find = id => items.find(i=>i.id===id);
  if(t.id==='addLink'){
    let url = $('iLink').value.trim(); if(!url) return;
    if(!/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
    const title = $('iTitle').value.trim() || url;
    $('iTitle').value = $('iLink').value = '';
    run(sb.from('items').insert({folder_id:current, type:'link', title, url}));
  }
  if(t.id==='pickPdf') $('pdfFile').click();
  if(t.dataset.open){ const w = window.open('', '_blank'); const u = await signed(find(t.dataset.open)); if(u && w) w.location = u; else if(u) location.href = u; else w?.close(); }
  if(t.dataset.dl){ const i = find(t.dataset.dl); const u = await signed(i, {download:i.file_name}); if(u){ const a=document.createElement('a'); a.href=u; document.body.appendChild(a); a.click(); a.remove(); } }
  if(t.dataset.rm && confirm('Remove this item?')){
    const i = find(t.dataset.rm);
    if(i.file_path) await sb.storage.from('pdfs').remove([i.file_path]);
    run(sb.from('items').delete().eq('id', i.id));
  }
  if(t.dataset.edit){ const i = find(t.dataset.edit), n = prompt('Edit title', i.title); if(n && n.trim()) run(sb.from('items').update({title:n.trim()}).eq('id', i.id)); }
};
$('content').onchange = async e => {
  if(e.target.id!=='pdfFile') return;
  const files = [...e.target.files], typed = $('iTitle').value.trim();
  for(const file of files){
    const path = `${user.id}/${crypto.randomUUID()}.pdf`;
    const up = await sb.storage.from('pdfs').upload(path, file, {contentType:'application/pdf'});
    if(up.error){ alert(`${file.name}: ${up.error.message}`); continue; }
    const title = (files.length===1 && typed) || file.name.replace(/\.pdf$/i,'');
    const {error} = await sb.from('items').insert({folder_id:current, type:'pdf', title, file_name:file.name, file_path:path});
    if(error) alert(error.message);
  }
  $('iTitle').value = ''; load();
};
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>

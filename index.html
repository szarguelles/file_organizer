<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Folder Organizer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1c1f24;--muted:#6b7280;--line:#e3e6ea;--accent:#2563eb;--danger:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#14161a;--card:#1d2026;--text:#e8eaed;--muted:#9aa0a9;--line:#2b2f37;--accent:#5b8cff;--danger:#f26b6b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
aside{width:260px;background:var(--card);border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
aside h1{font-size:18px;margin:0 0 4px}
main{flex:1;padding:24px;max-width:900px}
input,button,select{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button{cursor:pointer;background:var(--accent);color:#fff;border:0}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
button.del{background:transparent;color:var(--danger);border:0;padding:4px 8px}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0}
.folder{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;cursor:pointer}
.folder:hover{background:var(--bg)}.folder.active{background:var(--accent);color:#fff}
.folder small{opacity:.7}
.add{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.add input[type=text]{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.05em}
td a{color:var(--accent);text-decoration:none;word-break:break-all;cursor:pointer}
.empty{color:var(--muted);padding:30px;text-align:center}
.badge{font-size:11px;padding:2px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-right:6px}
@media(max-width:700px){body{flex-direction:column}aside{width:100%}}
</style>
</head>
<body>
<aside>
  <h1>📁 Folders</h1>
  <div class="row"><input id="newFolder" placeholder="New folder name"><button id="addFolder">+</button></div>
  <div id="folders"></div>
  <button class="ghost" id="exportBtn" style="margin-top:auto">Export backup</button>
  <button class="ghost" id="importBtn">Import backup</button>
  <input type="file" id="importFile" accept=".json" hidden>
</aside>
<main>
  <h2 id="title">Select or create a folder</h2>
  <div id="content"></div>
</main>

<script>
// ---------- IndexedDB (works offline) ----------
let db, current = null;
const open = indexedDB.open('folder-organizer', 1);
open.onupgradeneeded = e => {
  const d = e.target.result;
  d.createObjectStore('folders', {keyPath:'id', autoIncrement:true});
  d.createObjectStore('items', {keyPath:'id', autoIncrement:true}).createIndex('folderId','folderId');
};
open.onsuccess = e => { db = e.target.result; renderFolders(); };
open.onerror = () => alert('Storage unavailable. Try opening the file in Chrome/Edge/Firefox (not private mode).');

const req = r => new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const store = (n,m='readonly') => db.transaction(n,m).objectStore(n);
let dl = null;
(async()=>{ try{ dl = await window.claude?.use('downloads'); }catch(e){ dl = null; } })();
async function saveFile(filename, data){
  if(!dl){ // normal browser download (GitHub Pages / local file)
    const blob = data instanceof Blob ? data : new Blob([data],{type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); return;
  }
  try{ await dl.save({filename, data}); }catch(e){ if(e && e.code!=='declined') alert('Could not save: '+(e.message||e.code)); }
}
const b64ToBlob = d => { const [h,b]=d.split(','); const m=(h.match(/:(.*?);/)||[])[1]||'application/pdf'; const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return new Blob([u],{type:m}); };
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- Folders ----------
async function renderFolders(){
  const folders = await req(store('folders').getAll());
  const items = await req(store('items').getAll());
  $('folders').innerHTML = folders.map(f=>{
    const n = items.filter(i=>i.folderId===f.id).length;
    return `<div class="folder ${f.id===current?'active':''}" data-id="${f.id}">
      <span>📁 ${esc(f.name)} <small>(${n})</small></span>
      <span><button class="del" data-ren="${f.id}" title="Rename" style="color:inherit">✎</button><button class="del" data-del="${f.id}" title="Delete" style="color:inherit">✕</button></span></div>`;
  }).join('') || '<div class="empty">No folders yet</div>';
  if(current) renderItems();
}
$('addFolder').onclick = async () => {
  const name = $('newFolder').value.trim(); if(!name) return;
  current = await req(store('folders','readwrite').add({name}));
  $('newFolder').value=''; renderFolders();
};
$('newFolder').onkeydown = e => { if(e.key==='Enter') $('addFolder').click(); };
$('folders').onclick = async e => {
  const t = e.target;
  if(t.dataset.del){
    e.stopPropagation();
    if(!confirm('Delete this folder and everything inside?')) return;
    const id = +t.dataset.del;
    const items = await req(store('items').index('folderId').getAllKeys(id));
    const s = store('items','readwrite'); items.forEach(k=>s.delete(k));
    await req(store('folders','readwrite').delete(id));
    if(current===id){current=null;$('title').textContent='Select or create a folder';$('content').innerHTML='';}
    return renderFolders();
  }
  if(t.dataset.ren){
    e.stopPropagation();
    const f = await req(store('folders').get(+t.dataset.ren));
    const name = prompt('Rename folder', f.name); if(!name) return;
    f.name = name.trim(); await req(store('folders','readwrite').put(f));
    return renderFolders();
  }
  const el = t.closest('.folder'); if(el){ current = +el.dataset.id; renderFolders(); }
};

// ---------- Items ----------
async function renderItems(){
  const f = await req(store('folders').get(current)); if(!f) return;
  const items = await req(store('items').index('folderId').getAll(current));
  $('title').textContent = '📁 ' + f.name;
  $('content').innerHTML = `
    <div class="add">
      <input type="text" id="iTitle" placeholder="Title">
      <input type="text" id="iLink" placeholder="Paste a link (https://...)">
      <button id="addLink">Add link</button>
      <button class="ghost" id="pickPdf">Attach PDF</button>
      <input type="file" id="pdfFile" accept="application/pdf" multiple hidden>
    </div>
    ${items.length ? `<table><thead><tr><th>Title</th><th>Link / PDF</th><th></th></tr></thead><tbody>
      ${items.map(i=>`<tr>
        <td>${esc(i.title)}</td>
        <td>${i.type==='pdf'
          ? `<span class="badge">PDF</span><a data-open="${i.id}">${esc(i.fileName)}</a> · <a data-dl="${i.id}">download</a>`
          : `<span class="badge">LINK</span><a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.url)}</a>`}</td>
        <td><button class="del" data-edit="${i.id}" style="color:var(--muted)">✎</button><button class="del" data-rm="${i.id}">✕</button></td>
      </tr>`).join('')}</tbody></table>` : '<div class="empty">This folder is empty. Add a link or attach a PDF.</div>'}`;

  $('addLink').onclick = async () => {
    let url = $('iLink').value.trim(); if(!url) return;
    if(!/^[a-z]+:\/\//i.test(url)) url = 'https://' + url;
    const title = $('iTitle').value.trim() || url;
    await req(store('items','readwrite').add({folderId:current,type:'link',title,url}));
    renderFolders();
  };
  $('pickPdf').onclick = () => $('pdfFile').click();
  $('pdfFile').onchange = async e => {
    const typed = $('iTitle').value.trim();
    for(const file of e.target.files){
      const title = (e.target.files.length===1 && typed) || file.name.replace(/\.pdf$/i,'');
      await req(store('items','readwrite').add({folderId:current,type:'pdf',title,fileName:file.name,blob:file}));
    }
    renderFolders();
  };
}
$('content').onclick = async e => {
  const t = e.target;
  const get = id => req(store('items').get(+id));
  if(t.dataset.open){ const i = await get(t.dataset.open); const w = window.open(URL.createObjectURL(i.blob),'_blank'); if(!w) saveFile(i.fileName, i.blob); }
  if(t.dataset.dl){ const i = await get(t.dataset.dl); saveFile(i.fileName, i.blob); }
  if(t.dataset.rm){ if(confirm('Remove this item?')){ await req(store('items','readwrite').delete(+t.dataset.rm)); renderFolders(); } }
  if(t.dataset.edit){ const i = await get(t.dataset.edit); const n = prompt('Edit title', i.title); if(n){ i.title=n.trim(); await req(store('items','readwrite').put(i)); renderFolders(); } }
};

// ---------- Backup (JSON, PDFs embedded as base64) ----------
const toB64 = b => new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b)});
$('exportBtn').onclick = async () => {
  const folders = await req(store('folders').getAll());
  const items = await req(store('items').getAll());
  for(const i of items) if(i.blob){ i.data = await toB64(i.blob); delete i.blob; }
  saveFile('folder-organizer-backup.json', JSON.stringify({folders,items}));
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async e => {
  const data = JSON.parse(await e.target.files[0].text());
  const map = {};
  for(const f of data.folders){ const old=f.id; delete f.id; map[old] = await req(store('folders','readwrite').add(f)); }
  for(const i of data.items){
    delete i.id; i.folderId = map[i.folderId];
    if(i.data){ i.blob = b64ToBlob(i.data); delete i.data; }
    await req(store('items','readwrite').add(i));
  }
  renderFolders();
};
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
